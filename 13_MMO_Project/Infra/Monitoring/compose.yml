name: portfolio-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/chat-server.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/portfolio.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/portfolio.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  loki-ingest:
    image: caddy:2.11.8-alpine
    ports:
      - "127.0.0.1:3101:8080"
    volumes:
      - ./loki/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
